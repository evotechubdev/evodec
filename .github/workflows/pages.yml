name: Deploy EVODEC site and EVOTV portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evotv-pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare independent static sites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-dist/evotv/assets pages-dist/evotv/adm
          cp index.html pages-dist/index.html
          cp -R public pages-dist/public
          cp evotv/index.html evotv/site.css evotv/site.js pages-dist/evotv/
          cp evotv/programa_pc/assets/logo-evotv.png pages-dist/evotv/assets/logo-evotv.png
          cp evotv/programa_pc/assets/app-icon-256.png pages-dist/evotv/assets/app-icon-256.png
          cp -R evotv/adm/. pages-dist/evotv/adm/
      - name: Verify independent EVOTV routes
        shell: bash
        run: |
          set -euo pipefail
          test -f pages-dist/index.html
          test -f pages-dist/evotv/index.html
          test -f pages-dist/evotv/site.js
          test -f pages-dist/evotv/adm/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

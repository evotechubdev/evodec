name: Deploy EVOTEC site and EVOTV PWAs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evotv-pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare site structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-dist/evotv
          cp index.html pages-dist/index.html
          cp -R public pages-dist/public
          cp evotv/index.html pages-dist/evotv/index.html
          cp -R evotv/app pages-dist/evotv/app
          cp -R evotv/app2 pages-dist/evotv/app2
          test -f pages-dist/index.html
          test -f pages-dist/public/imagens/EVODEC-logo.png
          test -f pages-dist/evotv/app/index.html
          test -f pages-dist/evotv/app2/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

workflows:
  pwa-release:
    name: EVOTV PWA - React e Vite
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      groups:
        - evotv_config
      node: lts
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Instalar dependências
        script: npm install --no-audit --no-fund
      - name: Verificar e compilar a PWA
        script: |
          export VITE_FIREBASE_API_KEY="${FIREBASE_API_KEY:-AIzaSyDbSMFXN6pmkqfhtBm3no2bXoAbyT_FoAo}"
          export VITE_EVO_BACKEND_URL="${EVO_BACKEND_URL:-/pwa-api}"
          export VITE_EVO_VERSION="${EVO_VERSION:-1.0.6}"
          export VITE_EVO_VERSION_CODE="${EVO_VERSION_CODE:-bde12f9159868653eea9eb54f9150bc44e66e84909fa84ede26833be0a2f63b5}"
          export VITE_EVO_PLATFORM="${EVO_PLATFORM:-android}"
          npm run build
    artifacts:
      - dist/**

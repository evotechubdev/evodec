<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Catálogo EVOTV independente com dados disponíveis offline.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>EVOTV Catálogo Offline</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./index.html" aria-label="EVOTV Catálogo Offline">
      <img src="./assets/logo_evotv.png" alt="EVOTV">
      <span><strong>Catálogo</strong><small>offline</small></span>
    </a>
    <a class="admin-link" href="./admin.html">Administrador</a>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Biblioteca independente</p>
      <h1>Seu catálogo continua disponível, mesmo sem consultar a lista.</h1>
      <p id="app-status" class="status">Preparando catálogo local…</p>
    </section>
    <section class="catalog-panel" aria-labelledby="catalog-heading">
      <div class="section-heading">
        <div><p class="eyebrow">Filmes</p><h2 id="catalog-heading">Catálogo completo</h2></div>
        <span id="catalog-count">Carregando…</span>
      </div>
      <div class="filters">
        <label><span>Pesquisar</span><input id="catalog-search" type="search" placeholder="Nome do filme" autocomplete="off"></label>
        <label><span>Categoria</span><select id="category-filter"><option value="">Todas as categorias</option></select></label>
      </div>
      <div id="catalog-grid" class="catalog-grid" aria-live="polite"></div>
      <div id="load-sentinel" class="load-sentinel" aria-hidden="true"></div>
      <button id="load-more" class="secondary-action" type="button" hidden>Carregar mais</button>
    </section>
  </main>
  <dialog id="media-modal" class="media-modal">
    <button id="close-modal" class="modal-close" type="button" aria-label="Fechar">×</button>
    <div class="media-layout">
      <img id="media-image" class="media-poster" alt="">
      <div class="media-content">
        <p class="eyebrow">Selecionado</p>
        <h2 id="media-title"></h2>
        <p id="media-meta" class="media-meta"></p>
        <p id="player-message" class="status"></p>
        <video id="media-player" controls playsinline hidden></video>
        <button id="play-media" class="primary-action" type="button">Reproduzir</button>
      </div>
    </div>
  </dialog>
  <script>
    window.addEventListener('error', function (event) {
      var status = document.querySelector('#app-status');
      if (status) { status.textContent = 'Erro ao abrir catálogo: ' + (event.message || 'falha de execução'); status.classList.add('error'); }
    });
    window.addEventListener('unhandledrejection', function (event) {
      var status = document.querySelector('#app-status');
      var reason = event.reason && event.reason.message ? event.reason.message : 'falha assíncrona';
      if (status) { status.textContent = 'Erro ao abrir catálogo: ' + reason; status.classList.add('error'); }
    });
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>

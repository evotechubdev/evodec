services:
  - type: web
    name: evotv-pwa
    runtime: static
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyDbSMFXN6pmkqfhtBm3no2bXoAbyT_FoAo
      - key: VITE_EVO_BACKEND_URL
        value: /pwa-api
    routes:
      - type: rewrite
        source: /pwa-api/*
        destination: https://multimideas-evo-backend.onrender.com/*
      - type: redirect
        source: /pwa
        destination: /pwa/
      - type: rewrite
        source: /pwa/*
        destination: /pwa/index.html
